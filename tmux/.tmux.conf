# --- BASIC TMUX CONFIG ---

# Set prefix to Ctrl+a (like GNU Screen)
#unbind C-b
#set-option -g prefix C-a
#bind-key C-a send-prefix

# Enable mouse support (click to select panes, resize, scroll)
#set -g mouse on

# Use vi keys in copy mode
setw -g mode-keys vi

# Set window and pane index to start at 1
set -g base-index 1
setw -g pane-base-index 1

# Split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Easily switch panes with Alt + arrow keys
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize panes with Alt + Shift + arrow keys
bind -n M-S-Left resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up resize-pane -U 5
bind -n M-S-Down resize-pane -D 5

# Enable 256 color support
set -g default-terminal "screen-256color"

# Status bar styling
set -g status-bg black
set -g status-fg white
set -g status-left-length 40
set -g status-right-length 100
set -g status-left "#[fg=green]#S #[fg=yellow]|"
set -g status-right "#[fg=cyan]%Y-%m-%d #[fg=white]%H:%M #[fg=yellow]| #[fg=green]#(whoami)"

set -g mouse off

# Reload tmux config with prefix + r
bind r source-file ~/.tmux.conf \; display-message "Reloaded!"
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
